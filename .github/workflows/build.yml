name: Construire l'APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ecrire le projet
        run: |
          mkdir -p app/src/main/java/com/routine/app app/src/main/assets app/src/main/res/drawable app/src/main/res/mipmap-anydpi app/src/main/res/layout app/src/main/res/xml
          cat > settings.gradle <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'Routine'
          include ':app'
          EOF_0
          cat > app/build.gradle <<'EOF_1'
          plugins { id 'com.android.application' version '8.5.2' }

          android {
              namespace 'com.routine.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.routine.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName '1.1'
              }
          }
          EOF_1
          cat > app/src/main/AndroidManifest.xml <<'EOF_2'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32"/>
              <application
                  android:label="Ma routine"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <receiver android:name=".Sched$Alarm" android:exported="false"/>
                  <receiver android:name=".Sched$Boot" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      </intent-filter>
                  </receiver>
                  <receiver android:name=".RoutineWidget" android:exported="false">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/routine_widget_info"/>
                  </receiver>
              </application>
          </manifest>
          EOF_2
          cat > app/src/main/java/com/routine/app/MainActivity.java <<'EOF_3'
          package com.routine.app;

          import android.app.Activity;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              WebView w;

              public class Bridge {
                  @JavascriptInterface
                  public void save(String json) {
                      Sched.store(MainActivity.this, json);
                      Sched.all(MainActivity.this);
                      RoutineWidget.refreshAll(MainActivity.this);
                  }
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }
                  w = new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.getSettings().setDomStorageEnabled(true);
                  w.addJavascriptInterface(new Bridge(), "Android");
                  setContentView(w);
                  w.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  finish();
              }
          }
          EOF_3
          cat > app/src/main/java/com/routine/app/Sched.java <<'EOF_4'
          package com.routine.app;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import java.util.Calendar;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class Sched {
              static SharedPreferences p(Context c) {
                  return c.getSharedPreferences("r", 0);
              }

              static void store(Context c, String json) {
                  p(c).edit().putString("d", json).apply();
              }

              static PendingIntent pi(Context c, int i, String s, String e, String t) {
                  Intent it = new Intent(c, Alarm.class);
                  it.putExtra("i", i);
                  it.putExtra("s", s);
                  it.putExtra("e", e);
                  it.putExtra("t", t);
                  return PendingIntent.getBroadcast(c, i, it,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static void set(Context c, int i, String s, String e, String t) {
                  String[] h = s.split(":");
                  Calendar cal = Calendar.getInstance();
                  cal.set(Calendar.HOUR_OF_DAY, Integer.parseInt(h[0]));
                  cal.set(Calendar.MINUTE, Integer.parseInt(h[1]));
                  cal.set(Calendar.SECOND, 0);
                  cal.set(Calendar.MILLISECOND, 0);
                  if (cal.getTimeInMillis() <= System.currentTimeMillis() + 1000) {
                      cal.add(Calendar.DAY_OF_YEAR, 1);
                  }
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  PendingIntent pend = pi(c, i, s, e, t);
                  try {
                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.getTimeInMillis(), pend);
                  } catch (SecurityException x) {
                      am.set(AlarmManager.RTC_WAKEUP, cal.getTimeInMillis(), pend);
                  }
              }

              static void all(Context c) {
                  try {
                      AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                      int old = p(c).getInt("n", 0);
                      for (int i = 0; i < old; i++) {
                          am.cancel(pi(c, i, "", "", ""));
                      }
                      JSONArray a = new JSONArray(p(c).getString("d", "[]"));
                      for (int i = 0; i < a.length(); i++) {
                          JSONObject o = a.getJSONObject(i);
                          if (o.optBoolean("n", true)) {
                              set(c, i, o.getString("s"), o.getString("e"), o.getString("t"));
                          }
                      }
                      p(c).edit().putInt("n", a.length()).apply();
                  } catch (Exception x) {
                  }
              }

              public static class Alarm extends BroadcastReceiver {
                  @Override
                  public void onReceive(Context c, Intent in) {
                      int i = in.getIntExtra("i", 0);
                      String s = in.getStringExtra("s");
                      String e = in.getStringExtra("e");
                      String t = in.getStringExtra("t");
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      nm.createNotificationChannel(new NotificationChannel("r", "Routine", NotificationManager.IMPORTANCE_HIGH));
                      PendingIntent open = PendingIntent.getActivity(c, 0,
                              new Intent(c, MainActivity.class), PendingIntent.FLAG_IMMUTABLE);
                      Notification n = new Notification.Builder(c, "r")
                              .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                              .setContentTitle(t)
                              .setContentText(s + " - " + e)
                              .setContentIntent(open)
                              .setAutoCancel(true)
                              .build();
                      nm.notify(i, n);
                      set(c, i, s, e, t);
                  }
              }

              public static class Boot extends BroadcastReceiver {
                  @Override
                  public void onReceive(Context c, Intent in) {
                      all(c);
                  }
              }
          }
          EOF_4
          cat > app/src/main/java/com/routine/app/RoutineWidget.java <<'EOF_WIDGETJAVA'
          package com.routine.app;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.widget.RemoteViews;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.Calendar;

          public class RoutineWidget extends AppWidgetProvider {
              @Override
              public void onUpdate(Context context, AppWidgetManager manager, int[] ids) {
                  for (int id : ids) updateOne(context, manager, id);
              }

              public static void refreshAll(Context context) {
                  AppWidgetManager manager = AppWidgetManager.getInstance(context);
                  ComponentName component = new ComponentName(context, RoutineWidget.class);
                  int[] ids = manager.getAppWidgetIds(component);
                  for (int id : ids) updateOne(context, manager, id);
              }

              private static void updateOne(Context context, AppWidgetManager manager, int id) {
                  RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.routine_widget);
                  String title = "Film / Série / Jeu Vidéo";
                  String time = "12:45 – 17:45";
                  String status = "Ma routine";
                  try {
                      String raw = context.getSharedPreferences("r", 0).getString("d", "[]");
                      JSONArray items = new JSONArray(raw);
                      int now = Calendar.getInstance().get(Calendar.HOUR_OF_DAY) * 60 + Calendar.getInstance().get(Calendar.MINUTE);
                      JSONObject next = null;
                      for (int i = 0; i < items.length(); i++) {
                          JSONObject item = items.getJSONObject(i);
                          String start = item.optString("s", "12:45");
                          String end = item.optString("e", "17:45");
                          int a = minutes(start), b = minutes(end);
                          if (a <= now && now < b) { next = item; status = "En cours"; break; }
                          if (a > now && (next == null || a < minutes(next.optString("s", "23:59")))) next = item;
                      }
                      if (next != null) {
                          title = next.optString("t", title);
                          time = next.optString("s", "12:45") + " – " + next.optString("e", "17:45");
                          if ("Ma routine".equals(status)) status = "Prochaine activité";
                      }
                  } catch (Exception ignored) { }
                  views.setTextViewText(R.id.widget_title, title);
                  views.setTextViewText(R.id.widget_time, time);
                  views.setTextViewText(R.id.widget_status, status);
                  Intent open = new Intent(context, MainActivity.class);
                  PendingIntent pending = PendingIntent.getActivity(context, 0, open,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  views.setOnClickPendingIntent(R.id.widget_root, pending);
                  manager.updateAppWidget(id, views);
              }

              private static int minutes(String value) {
                  try { String[] p = value.split(":"); return Integer.parseInt(p[0]) * 60 + Integer.parseInt(p[1]); }
                  catch (Exception e) { return 0; }
              }
          }
          EOF_WIDGETJAVA
          cat > app/src/main/res/layout/routine_widget.xml <<'EOF_WIDGETLAYOUT'
